name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies (retry transient download failures)
        shell: pwsh
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
        run: |
          $attempt = 1
          while ($attempt -le 3) {
            Write-Host "Dependency installation attempt $attempt of 3"
            npm install
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "Install failed; waiting 15 seconds before retry."
              Start-Sleep -Seconds 15
            }
            $attempt++
          }
          throw "npm install failed after 3 attempts."

      - name: Build Windows app
        run: npm run build

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish Windows EXE as GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Store POS Calculator v${{ steps.version.outputs.version }}
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
